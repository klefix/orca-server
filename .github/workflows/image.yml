name: image

on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "orca=$(grep -oP '^ARG ORCA_VERSION=\K.+' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orca-server:${{ steps.version.outputs.orca }}
            ghcr.io/${{ github.repository_owner }}/orca-server:latest
